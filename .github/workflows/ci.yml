name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Start Kafka, Schema Registry and Postgres
        run: make up

      - name: Integration tests
        run: make test

      - name: Chaos tests (broker outage)
        run: make chaos

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
