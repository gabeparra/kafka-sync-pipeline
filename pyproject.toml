[project]
name = "kafka-sync-pipeline"
version = "0.1.0"
description = "Kafka (KRaft) event-streaming and CDC reconciliation lab"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mariano Gabriel Parra" }]
dependencies = [
    "confluent-kafka[json,schemaregistry]>=2.12",
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kafka_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disruptive tests restart the broker; run them on purpose with `make chaos`.
addopts = "-ra --strict-markers -m 'not disruptive'"
timeout = 180
markers = [
    "integration: needs the local stack running (make up)",
    "disruptive: stops and restarts stack containers (make chaos)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
